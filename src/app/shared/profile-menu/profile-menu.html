<div class="profile">
  <button type="button" class="avatar-btn" aria-haspopup="menu" [attr.aria-expanded]="open()" (click)="toggle()">
    <span class="avatar">{{ initials() }}</span>
    <span class="caret">▾</span>
  </button>

  @if (open()) {
    <div class="dropdown" role="menu">
      <div class="dropdown-head">
        <span class="avatar big">{{ initials() }}</span>
        <div>
          <strong>{{ name() }}</strong>
          <small>Customer</small>
        </div>
      </div>

      @for (item of items; track item.label) {
        <button type="button" class="menu-item" role="menuitem" (click)="onItemClick(item)">
          <span>{{ item.icon }}</span> {{ item.label }}
        </button>
      }

      <hr />
      <button type="button" class="menu-item logout" role="menuitem" (click)="logout()">
        <span>🚪</span> Logout
      </button>
    </div>
  }
</div>

<!-- Saved Addresses popup (add / edit / delete) -->
@if (addressesOpen()) {
  <app-address-picker mode="manage" (closed)="addressesOpen.set(false)" />
}
