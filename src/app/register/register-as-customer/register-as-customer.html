<div class="register-wrapper">
  <!-- Close Button linking back to home -->
  <a routerLink="/" class="close-btn">✕</a>

  <div class="register-card">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form-layout">
      
      <!-- Left Panel: Light Theme -->
      <div class="panel light-panel">
        <h2 class="panel-title blue-text">General Information</h2>

        <div class="row">
          <div class="input-group">
            <label>First Name</label>
            <input type="text" formControlName="firstName" />
          </div>
          <div class="input-group">
            <label>Last Name</label>
            <input type="text" formControlName="lastName" />
          </div>
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input type="email" formControlName="email" />
        </div>

        <div class="input-group">
          <label>Phone Number</label>
          <input type="tel" formControlName="phone" />
        </div>
      </div>

      <!-- Right Panel: Dark Theme -->
      <div class="panel dark-panel">
        <h2 class="panel-title white-text">Security & Address</h2>

        <div class="input-group dark-input">
          <label>Street Address</label>
          <input type="text" formControlName="address" />
        </div>

        <div class="row">
          <div class="input-group dark-input">
            <label>State</label>
            <input type="text" formControlName="state" />
          </div>
          <div class="input-group dark-input">
            <label>Pincode</label>
            <input type="text" formControlName="pincode" />
          </div>
        </div>

        <div class="row">
          <div class="input-group dark-input">
            <label>Password</label>
            <input type="password" formControlName="password" />
          </div>
          <div class="input-group dark-input">
            <label>Confirm Password</label>
            <input type="password" formControlName="confirmPassword" />
          </div>
        </div>

        <!-- Terms and Submit -->
        <div class="footer-actions">
          <label class="checkbox-container">
            <input type="checkbox" formControlName="terms">
            <span class="checkmark"></span>
            I do accept the <a href="#">Terms and Conditions</a> of your site.
          </label>

          <button type="submit" class="submit-btn" [disabled]="registerForm.invalid">
            Register Customer
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
