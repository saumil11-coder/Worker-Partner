<div class="home-wrapper">
  <div class="home-card">
    
    <!-- Left Side: Architectural / Property Background Image -->
    <div class="image-section">
      <div class="brand-top-left">
        <span class="logo-icon">❖</span>
        <span class="brand-title">WorkerPartner</span>
      </div>
    </div>

    <!-- Right Side: Content / Form Window -->
    <div class="form-section">
      <div class="form-header">
        <h2>Welcome to <span class="highlight">WorkerPartner</span></h2>
        <p class="subtext">If you have problem, we have WorkerPartner</p>
      </div>

      <!-- NEW: Role switcher (choose once, buttons below update automatically) -->
      <div class="role-tabs">
        <button type="button" [class.active]="role === 'customer'" (click)="setRole('customer')">
          🛒 Customer
        </button>
        <button type="button" [class.active]="role === 'employee'" (click)="setRole('employee')">
          🛠️ Employee
        </button>
      </div>

      <form [formGroup]="homeForm" (ngSubmit)="onSubmit()">
        <div class="input-field">
          <span class="field-icon">👤</span>
          <input 
            type="text" 
            formControlName="username" 
            placeholder="Email ID or Mobile Number" 
          />
        </div>

        <div class="input-field">
          <span class="field-icon">🔑</span>
          <input 
            type="password" 
            formControlName="password" 
            placeholder="••••••••" 
          />
        </div>

        <div class="options-row">
          <label class="remember-me">
            <input type="checkbox" formControlName="rememberMe" />
            <span>Remember me</span>
          </label>
          <a routerLink="/forgot" class="forgot-link">Forgot password?</a>
        </div>

          <p *ngIf="loginMessage()" class="login-error">
          {{ loginMessage() }}
        </p>

        <!-- Login button: text changes with the selected role -->
        <div class="login-row">
          <button type="submit" class="btn btn-primary btn-center">
            Login as {{ role === 'customer' ? 'Customer' : 'Employee' }}
          </button>
        </div>

        <!-- Divider text -->
        <div class="or-divider">
          <span>NEW HERE?</span>
        </div>

        <!-- Register button: text and route change with the selected role -->
        <div class="register-options-row">
          <a [routerLink]="'/register/' + role" class="btn btn-secondary">
            Register as {{ role === 'customer' ? 'Customer' : 'Employee' }}
          </a>
        </div>
      </form>

      <div class="social-footer">
        <span>Or login with</span>
        <div class="social-links">
          <a href="#">Facebook</a>
          <a href="#">LinkedIn</a>
          <a href="#">Google</a>
        </div>
      </div>
    </div>

  </div>
</div>
